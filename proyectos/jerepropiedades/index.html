<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Propiedades — CRM Inmobiliario</title>
  <meta name="description" content="CRM inmobiliario de Corbik Propiedades para gestión de propiedades en Mar del Plata" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <script type="module" crossorigin src="./assets/main-C91yWOYW.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-Cf3xff8G.js">
  <link rel="stylesheet" crossorigin href="./assets/main-DNibwEPd.css">
</head>

<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo" id="logo">
          <div class="logo-icon">JP</div>
          <span class="logo-text">Propiedades</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <a href="#/dashboard" class="nav-item active" data-route="dashboard" id="nav-dashboard">
          <i data-lucide="layout-dashboard"></i>
          <span data-i18n="nav.dashboard">Dashboard</span>
        </a>
        <a href="#/properties" class="nav-item" data-route="properties" id="nav-properties">
          <i data-lucide="building-2"></i>
          <span data-i18n="nav.properties">Propiedades</span>
        </a>
        <a href="#/properties/new" class="nav-item" data-route="properties-new" id="nav-new-property">
          <i data-lucide="plus-circle"></i>
          <span data-i18n="nav.newProperty">Nueva Propiedad</span>
        </a>
        <a href="#/map" class="nav-item" data-route="map" id="nav-map">
          <i data-lucide="map-pin"></i>
          <span data-i18n="nav.map">Mapa</span>
        </a>
      </nav>

      <div style="padding: 20px; border-top: 1px solid var(--border-2); margin-top: auto;">
        <a href="./client.html" class="nav-item" style="color: var(--accent); font-weight: bold; justify-content: center; border: 1px solid var(--accent); border-radius: 8px;">
          Ver sitio como cliente
        </a>
      </div>

      <div class="sidebar-footer">
        <button class="lang-toggle" id="lang-toggle" title="Cambiar idioma">
          <i data-lucide="languages"></i>
          <span id="lang-label">ES</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <!-- Header -->
      <header class="header" id="header">
        <button class="sidebar-toggle" id="sidebar-toggle">
          <i data-lucide="menu"></i>
        </button>
        <div class="header-title">
          <h1 id="page-title" data-i18n="dashboard.title">Dashboard</h1>
        </div>
        <div class="header-actions">
          <div class="search-box" id="search-box">
            <i data-lucide="search"></i>
            <input type="text" id="global-search" data-i18n-placeholder="header.search"
              placeholder="Buscar propiedades..." />
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <div id="page-content" class="page-content">
        <!-- Dynamic content injected here -->
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Modal Container -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div id="modal-content" class="modal-content"></div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" style="display:none;">
    <button class="lightbox-close" id="lightbox-close"><i data-lucide="x"></i></button>
    <button class="lightbox-prev" id="lightbox-prev"><i data-lucide="chevron-left"></i></button>
    <button class="lightbox-next" id="lightbox-next"><i data-lucide="chevron-right"></i></button>
    <div class="lightbox-content" id="lightbox-content"></div>
    <div class="lightbox-counter" id="lightbox-counter"></div>
  </div>

</body>

</html>
